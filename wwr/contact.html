<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Water Rafting</title>
  <meta name="description" content="Contact White Water Rafting for questions, reservations, and suggestions. Find our address, phone, email, and send us a message.">
  <meta name="author" content="Ikyaager Edward">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <h1>Contact Us</h1>
    <section class="contact-info">
      <h2>White Water Rafting</h2>
      <p>123 River Road<br>Idaho Falls, ID 83402<br>United States</p>
      <p>Phone: +1 (208) 555-0147</p>
      <p>Email: info@whitewaterrafting.com</p>
    </section>
    <section class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11551.123456!2d-112.034!3d43.466!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDPCsDI3JzU4LjAiTiAxMTLCsDAyJzAyLjQiVw!5e0!3m2!1sen!2sus!4v1700000000000" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
    <section class="employees">
      <h2>Meet Our Team</h2>
      <figure>
        <img src="images/employee1.jpg" alt="Sarah Johnson, Trip Leader">
        <figcaption>Sarah Johnson - Trip Leader</figcaption>
      </figure>
      <figure>
        <img src="images/employee2.jpg" alt="Mike Brown, Safety Guide">
        <figcaption>Mike Brown - Safety Guide</figcaption>
      </figure>
      <figure>
        <img src="images/employee3.jpg" alt="Emily Davis, Customer Support">
        <figcaption>Emily Davis - Customer Support</figcaption>
      </figure>
    </section>
    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <label for="fullname">Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <label for="useremail">Email:</label>
        <input type="email" id="useremail" name="useremail" required>
        <p>Purpose of Message:</p>
        <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
        <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
        <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <label><input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter</label>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
  <footer>
    <p>© 2026 White Water Rafting | Ikyaager Edward</p>
    <nav class="sociallinks">
      <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
      <a href="https://twitter.com"><img src="images/twitter.svg" alt="Twitter"></a>
      <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
    </nav>
  </footer>
</body>
</html>
